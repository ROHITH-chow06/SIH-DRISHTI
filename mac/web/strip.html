<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DRISHTI - Cab Strip View</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111;
            --text-main: #fff;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #333;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .strip-container { 
            width: 450px; 
            height: 90vh; 
            background: var(--panel-bg); 
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .section-divider {
            border-top: 2px dashed #444;
            width: 100%;
        }

        .header {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #1a1a1a;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-weight: bold; 
            color: var(--text-muted); 
            font-size: 1.1rem; 
            letter-spacing: 0.1em;
        }

        .demo-badge {
            font-size: 0.7rem;
            background: #ef4444;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .gov-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gov-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .gov-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .gov-value.clear { color: var(--accent-green); }
        .gov-value.caution { color: var(--warning); }
        .gov-value.slow { color: var(--warning); }
        .gov-value.stop { color: var(--danger); }

        .road-ahead {
            flex: 1;
            position: relative;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .fog-overlay { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(226, 232, 240, 0.3); 
            pointer-events: none; 
            z-index: 20; 
            display: none; 
        }

        .road-title {
            position: absolute;
            top: 10px;
            left: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 30;
        }

        .corridor-line {
            position: absolute;
            top: 100px;
            bottom: 120px;
            width: 8px;
            background: var(--accent-green);
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .corridor-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            padding: 4px 10px;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 0.8rem;
            border-radius: 12px;
            z-index: 10;
            white-space: nowrap;
            font-weight: bold;
        }

        .vehicle { 
            font-size: 4rem; 
            position: absolute; 
            top: 40px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 5; 
            text-shadow: 0px 5px 10px rgba(0,0,0,0.8); 
        }

        .vehicle-label {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 15;
            white-space: nowrap;
            border: 1px solid var(--border-color);
        }

        .obstacle-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            display: none;
        }

        .obstacle-icon { font-size: 3rem; text-shadow: 0px 5px 10px rgba(0,0,0,0.8); }
        .obstacle-name { color: var(--danger); font-weight: bold; font-size: 1rem; margin-top: 5px; text-transform: uppercase;}
        .obstacle-dist { color: var(--text-main); font-size: 1.2rem; font-weight: bold;}
        .obstacle-badge { background: #ef4444; color: white; font-size: 0.6rem; padding: 2px 4px; border-radius: 2px; margin-top: 2px; }

        .footer {
            padding: 15px;
            background: #1a1a1a;
            font-family: monospace;
            font-size: 1rem;
            line-height: 1.6;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
        }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: bold; }

    </style>
</head>
<body>
    <div class="strip-container">
        <div class="header">
            <div class="header-top">
                <div class="title">DRISHTI CAB STRIP</div>
                <div class="demo-badge">SIMULATION / DEMO</div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; background: #000; padding: 5px; border-radius: 4px; border: 1px solid #333;">
                <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 5px;">ACTIVE VEHICLE</span>
                <select id="vehicle-select" style="background: #222; color: white; border: 1px solid #444; padding: 4px; border-radius: 4px; font-weight: bold;">
                    <option value="">Waiting for GPS...</option>
                </select>
            </div>

            <div class="gov-header">
                <div>
                    <div class="gov-label">GOVERNOR</div>
                    <div class="gov-value" id="gov-state">--</div>
                </div>
                <div style="text-align: right;">
                    <div class="gov-label">SAFE SPEED</div>
                    <div class="gov-value" id="gov-speed">--</div>
                </div>
            </div>
        </div>

        <div class="section-divider"></div>

        <div class="road-ahead">
            <div class="fog-overlay" id="fog-overlay"></div>
            <div class="road-title">ROAD AHEAD</div>
            
            <div class="vehicle">🚚</div>
            <div class="vehicle-label" id="active-vid">--</div>
            
            <div class="corridor-line">
                <div class="corridor-label">🟢 VALIDATED CORRIDOR</div>
            </div>
            
            <div class="obstacle-container" id="obs-container">
                <div class="obstacle-icon" id="obs-icon">🚧</div>
                <div class="obstacle-name" id="obs-name">PEDESTRIAN</div>
                <div class="obstacle-dist" id="obs-dist">35 m</div>
                <div class="obstacle-badge">SIMULATED OBSTACLE</div>
            </div>
        </div>

        <div class="section-divider"></div>

        <div class="footer">
            <div class="stat-row">
                <span class="stat-label">VISIBILITY</span>
                <span class="stat-value" id="env-vis">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">ROAD</span>
                <span class="stat-value" id="env-road">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">GOVERNOR</span>
                <span class="stat-value" id="foot-gov">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">PERMITTED SPEED</span>
                <span class="stat-value" id="foot-speed">--</span>
            </div>
        </div>
    </div>

    <script>
        let vehicleData = {};

        async function fetchMapVehicles() {
            try {
                const resVeh = await fetch('/api/map/vehicles');
                vehicleData = await resVeh.json();
                
                const vSelect = document.getElementById('vehicle-select');
                const currentVal = vSelect.value;
                const vids = Object.keys(vehicleData);
                
                if (vids.length > 0) {
                    vSelect.innerHTML = vids.map(id => `<option value="${id}">${id}</option>`).join('');
                    if (vids.includes(currentVal)) {
                        vSelect.value = currentVal;
                    }
                } else {
                    vSelect.innerHTML = `<option value="">Waiting for GPS...</option>`;
                }
                
                const activeVid = vSelect.value;
                document.getElementById('active-vid').innerText = activeVid ? activeVid : '--';

            } catch(e) {}
        }

        async function fetchState() {
            try {
                const govRes = await fetch('/api/governor/state');
                const gov = await govRes.json();
                
                const simRes = await fetch('/api/simulator/state');
                const sim = await simRes.json();
                
                // Update Top Header
                const govStateEl = document.getElementById('gov-state');
                govStateEl.className = 'gov-value ' + gov.state.toLowerCase();
                govStateEl.innerText = gov.state;
                document.getElementById('gov-speed').innerText = gov.final_speed_limit_kmh + ' km/h';
                
                // Update Footer
                document.getElementById('env-vis').innerText = sim.visibility;
                document.getElementById('env-road').innerText = sim.road;
                document.getElementById('foot-gov').innerText = gov.state;
                document.getElementById('foot-speed').innerText = gov.final_speed_limit_kmh + ' km/h';

                // Update Road Ahead Overlays
                const obsContainer = document.getElementById('obs-container');
                const obsIcon = document.getElementById('obs-icon');
                const obsName = document.getElementById('obs-name');
                const obsDist = document.getElementById('obs-dist');
                const fog = document.getElementById('fog-overlay');

                if (sim.obstacle !== 'NONE') {
                    obsContainer.style.display = 'flex';
                    obsIcon.innerText = sim.obstacle === 'PEDESTRIAN' ? '🚶' : '🚧';
                    obsName.innerText = sim.obstacle;
                    obsDist.innerText = "35 m"; // Simulated distance
                } else {
                    obsContainer.style.display = 'none';
                }
                
                if (sim.visibility === 'FOG') {
                    fog.style.display = 'block';
                } else {
                    fog.style.display = 'none';
                }
                
            } catch (e) { console.error(e); }
        }

        setInterval(fetchState, 1000);
        setInterval(fetchMapVehicles, 1000);
        fetchState();
        fetchMapVehicles();
        
        document.getElementById('vehicle-select').addEventListener('change', () => {
            const vSelect = document.getElementById('vehicle-select');
            document.getElementById('active-vid').innerText = vSelect.value || '--';
        });
    </script>
</body>
</html>
